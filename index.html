<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metas do Dia · Cartão de TODOS</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#00A989;--teal9:#006B57;--lime:#A6FF00;--lime2:#7FD400;--bg:#F2F7F5;--card:#fff;--ink:#0E2520;--mut:#587069;--line:#DCE8E4;--track:#E3EEEA;--refu:#E8501E;--tim:#1652C8;--red:#D2402F}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",Arial,sans-serif;overflow-x:clip}
.R{font-family:Rubik,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lime2);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(3vw,14px)}
header{background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.top img{height:46px;display:block}
.stamp{font-size:13px;font-weight:700;color:var(--mut);text-align:right}
main{padding:20px 0 48px}
.board{background:linear-gradient(135deg,#00785F,var(--teal) 55%,#13C29C);color:#fff;border-radius:24px;padding:clamp(18px,3vw,32px);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-90px;top:-100px;width:320px;height:320px;border-radius:50%;background:var(--lime);opacity:.16}
.brow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;z-index:1}
.k{font-weight:800;font-size:14px;opacity:.92}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0}
.score b{font:900 clamp(64px,11vw,116px)/.95 Rubik,Arial,sans-serif;letter-spacing:-3px}
.score span{font:700 clamp(20px,3vw,30px) Rubik,Arial,sans-serif;opacity:.88}
.pill{display:inline-block;background:var(--lime);color:#0B2A20;border-radius:999px;padding:7px 16px;font:900 18px Rubik,Arial,sans-serif}
.pbar{height:18px;border-radius:99px;background:rgba(255,255,255,.22);margin:18px 0 8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.legend{font-size:13.5px;opacity:.92}
.kpis{display:grid;gap:10px}
.kpi{color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:#fff;border:0;border-radius:16px;padding:12px 14px;text-align:left;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .t{font-weight:800;font-size:14px}.kpi .v{font:800 22px Rubik,Arial,sans-serif;white-space:nowrap}.kpi .v small{font-size:14px;color:var(--mut)}
.kpi .s{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track);overflow:hidden}.kpi .s i{display:block;height:100%}
.kpi em{grid-column:1/-1;color:var(--mut);font-size:12.5px;font-style:normal}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.sh h2{font:800 24px Rubik,Arial,sans-serif;margin:0}.sh p{margin:2px 0 0;color:var(--mut);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;min-height:40px}
.filters button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.seller{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;position:relative;transition:transform .15s,box-shadow .15s}
.seller:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,80,60,.12)}
.seller.done{box-shadow:inset 0 0 0 2px var(--teal)}
.sl{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 16px Rubik,Arial,sans-serif;flex:none}
.pos{position:absolute;right:12px;top:10px;font:800 13px Rubik,Arial,sans-serif;color:var(--mut)}
.nm{font-weight:800;font-size:16px;line-height:1.2}.sub{color:var(--mut);font-size:12.5px}
.big{display:flex;align-items:baseline;gap:6px;margin:12px 0 6px}.big b{font:900 40px/1 Rubik,Arial,sans-serif}.big span{color:var(--mut);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.need{margin-top:9px;font-weight:800;font-size:14px}
.contrib{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.contrib div{border-radius:10px;padding:6px 9px;font-size:12.5px;font-weight:700}
.contrib b{font:800 17px Rubik,Arial,sans-serif;display:block}
.c-t{background:rgba(22,82,200,.09);color:var(--tim)}.c-r{background:rgba(232,80,30,.1);color:var(--refu)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.prod{border-radius:22px;padding:clamp(18px,2.6vw,26px);color:#fff}
.prod.r{background:linear-gradient(135deg,#C93D10,var(--refu))}.prod.t{background:linear-gradient(135deg,#0D3C99,var(--tim))}
.prod .score b{font-size:clamp(52px,7vw,80px)}
.prod .pbar i{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.15);border-radius:12px;padding:9px 11px}
.stats b{display:block;font:800 24px/1.1 Rubik,Arial,sans-serif}.stats span{font-size:12.5px;opacity:.92}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.4vw,24px);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--mut);font-size:13px;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:hover td{background:#F6FAF8}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
dialog{border:0;border-radius:24px;padding:0;width:min(540px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,30,24,.55)}
.mh{padding:20px 22px;color:#fff;position:relative}
.mh h3{font:800 28px Rubik,Arial,sans-serif;margin:2px 0}
.x{position:absolute;right:12px;top:12px;z-index:2;background:rgba(255,255,255,.22);border:0;border-radius:12px;width:44px;height:44px;color:#fff;font-size:22px}
.mb{padding:18px 22px 22px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 div{background:var(--bg);border-radius:12px;padding:10px}
.row3 b{display:block;font:800 24px Rubik,Arial,sans-serif}.row3 span{font-size:12.5px;color:var(--mut)}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
h4{margin:18px 0 6px;font:800 16px Rubik,Arial,sans-serif}
.gbtn{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px}
dialog.g{width:min(760px,96vw)}
.gh{background:#0B2A20;color:#fff;padding:18px 22px;position:relative}.gh h3{font:800 24px Rubik,Arial,sans-serif;margin:0}
.gb{padding:16px 22px 22px;max-height:72vh;overflow:auto}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13.5px}
.fl input[type=number],.fl input[type=text],.fl input[type=password]{font:16px "Nunito Sans",Arial;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:44px;width:100%}
.fl small{color:var(--mut);font-weight:600}
.sv{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.b1{border:0;border-radius:12px;padding:11px 16px;font-weight:800;min-height:44px;background:var(--teal);color:#fff}.b2{border:0;border-radius:12px;padding:11px 16px;font-weight:800;min-height:44px;background:var(--track)}
.msg{margin-top:10px;font-weight:700;font-size:14px}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{font-weight:800;cursor:pointer}
@media(max-width:820px){.brow,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.top img{height:36px}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.big b{font-size:32px}.contrib{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stamp{text-align:left}}
@media print{.filters,.x{display:none}body{background:#fff}}

.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.act{border:0;border-radius:14px;padding:14px 8px;color:#fff;font:900 16px Rubik,Arial,sans-serif;min-height:68px}
.act small{display:block;font:700 12px "Nunito Sans",Arial;opacity:.9;margin-top:2px}
.act:disabled{opacity:.5}
.undo{border:0;background:var(--track);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;min-height:36px}
.banner{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px;background:#FFF6D6;color:#5A4500}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA}.dot.on{background:var(--teal);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.35}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B2A20;color:#fff;padding:13px 20px;border-radius:16px;font-weight:800;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.on{opacity:1}.toast.win{background:var(--lime);color:#0B2A20;font-size:18px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;min-height:40px}.tabs button.on{background:#0B2A20;color:#fff;border-color:#0B2A20}
.st{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}.st.pendente{background:#FFF1C9;color:#7A5A00}.st.validado{background:#DDF7EE;color:var(--teal9)}.st.dup{background:#FDE3DF;color:var(--red)}
.mini-b{border:0;border-radius:9px;padding:6px 10px;font-weight:800;font-size:13px;min-height:36px;background:var(--teal);color:#fff}.mini-b.no{background:var(--track);color:var(--ink)}
select{font:16px "Nunito Sans",Arial;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:44px;width:100%}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--track);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.acts{grid-template-columns:1fr}}
</style>
</head>

/* ===================================== */
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.min(100,100*a/b):0;
const P=(a,b)=>b?Math.round(100*a/b)+'%':'—';
const ini=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('');
const pl=(n,s,p)=>n===1?s:p;
const pad=n=>String(n).padStart(2,'0');
const isoOf=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const isoBR=br=>{const [d,m,y]=String(br).split('/');return `${y}-${pad(m)}-${pad(d)}`};
const LS={get:k=>{try{return localStorage.getItem(k)||''}catch{return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const TIPO={cdt:{n:'Cartão de TODOS',c:'#00A989'},tim:{n:'TIM Controle',c:'#1652C8'},refu:{n:'Refuturiza',c:'#E8501E'}};

let SES=(()=>{try{return JSON.parse(LS.get('cdt_ses')||'null')}catch{return null}})();
const ehG=()=>SES&&SES.papel==='gestao';
const cut=t=>BASE['ms_'+t]??BASE.ms;
let BASE=INICIAL, LANC=[], online=false, carregadoEm=Date.now(), filtro='todos', ordem='ranking', abertoV=null;
if(!API_URL){ try{LANC=JSON.parse(LS.get('cdt_demo')||'[]')}catch{LANC=[]} }

/* ---------- cálculo: base da gestão + registros dos vendedores ---------- */
function diasUteis(){
  const h=new Date(), y=h.getFullYear(), m=h.getMonth(), mes=`${y}-${pad(m+1)}`;
  if(BASE.du_mes===mes&&Array.isArray(BASE.du_list)) return BASE.du_list;
  const fer=BASE.feriados_mes===mes?(BASE.feriados||[]):[], fim=new Date(y,m+1,0).getDate(), out=[];
  for(let d=1;d<=fim;d++){const w=new Date(y,m,d).getDay();if(w>0&&w<6&&!fer.includes(d))out.push(d)}
  return out;
}
let S;
function derive(){
  const hoje=isoOf(Date.now()), diaHoje=new Date().getDate();
  const baseDia=isoBR(BASE.data), mesHoje=hoje.slice(0,7), qz=iso=>iso.slice(0,7)+(+iso.slice(8)>=16?'b':'a');
  const mesmoMes=baseDia.slice(0,7)===mesHoje, mesmaQz=qz(baseDia)===qz(hoje);
  const novos=[]; /* lançamentos manuais desativados: números vêm só dos relatórios e da gestão */
  const doMes=novos.filter(l=>isoOf(l.ms).slice(0,7)===mesHoje);
  const DU=Math.max(1,diasUteis().filter(x=>x>=diaHoje).length||1);
  const V=BASE.vendedores.map(v=>{
    const meus=novos.filter(l=>l.v===v.nome);
    const cdtHoje=meus.filter(l=>l.tipo==='cdt'&&isoOf(l.ms)===hoje).length;
    const cdtAntes=meus.filter(l=>l.tipo==='cdt'&&isoOf(l.ms)!==hoje&&qz(isoOf(l.ms))===qz(hoje)).length;
    const hojeN=(baseDia===hoje?v.hoje:0)+cdtHoje;
    const q2=(mesmaQz?v.q2+(baseDia===hoje?0:v.hoje):0)+cdtAntes;
    const meta=v.ferias?0:Math.ceil(Math.max(0,v.mq2-q2)/DU);
    const todosMes=LANC.filter(l=>l.v===v.nome&&isoOf(l.ms).slice(0,7)===mesHoje);
    return {...v,hoje:hojeN,q2,meta_hoje:meta,falta:Math.max(0,meta-hojeN),
      refu_mes:(mesmoMes?v.refu_mes:0)+doMes.filter(l=>l.v===v.nome&&l.tipo==='refu').length,
      tim_reg:todosMes.filter(l=>l.tipo==='tim').length,refu_reg:todosMes.filter(l=>l.tipo==='refu').length,
      regHoje:[],
      vendas:baseDia===hoje?(v.vendas||[]):[]};
  });
  const A=V.filter(v=>!v.ferias);
  const canaisObj=baseDia===hoje?BASE.canais:Object.fromEntries(Object.keys(BASE.canais).map(k=>[k,0]));
  const canais=Object.values(canaisObj).reduce((a,b)=>a+(+b||0),0);
  const vend=V.reduce((a,v)=>a+v.hoje,0),total=vend+canais;
  const tim={meta:BASE.tim.meta,real:(mesmoMes?BASE.tim.real:0)+doMes.filter(l=>l.tipo==='tim').length};
  const refu={meta:BASE.refu.meta,real:(mesmoMes?BASE.refu.real:0)+doMes.filter(l=>l.tipo==='refu').length};
  for(const g of [tim,refu]){g.falta=Math.max(0,g.meta-g.real);g.cota=Math.ceil(g.falta/Math.max(1,A.length))}
  const rank=[...A].sort((a,b)=>b.hoje-a.hoje||(b.hoje/(b.meta_hoje||1))-(a.hoje/(a.meta_hoje||1))||a.nome.localeCompare(b.nome)).map(v=>v.nome);
  S={hoje,V,A,DU,canaisObj,canais,vend,total,meta:BASE.meta_unid_dia,falta:Math.max(0,BASE.meta_unid_dia-total),
     somaMetas:A.reduce((a,v)=>a+v.meta_hoje,0),tim,refu,rank};
  return S;
}

/* ---------- telas ---------- */
function kpi(t,v,m,cor,sub,go){return `<button class="kpi" data-go="${go}"><span class="t">${t}</span><span class="v">${v} <small>/ ${m}</small></span><span class="s"><i style="width:${pct(v,m)}%;background:${cor}"></i></span><em>${sub}</em></button>`}
function card(v){
  const done=v.meta_hoje>0&&v.hoje>=v.meta_hoje, pos=S.rank.indexOf(v.nome)+1, eu=SES&&SES.v===v.nome;
  return `<button class="seller ${done?'done':''}" style="${eu?'outline:3px solid var(--lime2);outline-offset:2px':''}" data-s="${esc(v.nome)}">
  <span class="pos">${pos}º</span>
  <div class="sl"><span class="av" style="background:${v.cor}">${esc(ini(v.nome))}</span><div><div class="nm">${esc(v.nome)}</div><div class="sub">meta de hoje: ${v.meta_hoje}</div></div></div>
  <div class="big"><b>${v.hoje}</b><span>/ ${v.meta_hoje} hoje · ${P(v.hoje,v.meta_hoje)}</span></div>
  <div class="bar"><i style="width:${pct(v.hoje,v.meta_hoje)}%;background:${done?'var(--lime2)':v.cor}"></i></div>
  <div class="need" style="color:${done?'var(--teal9)':v.falta>=3?'var(--red)':'var(--ink)'}">${done?`Meta do dia batida${v.hoje>v.meta_hoje?` · +${v.hoje-v.meta_hoje} além`:''}`:`${pl(v.falta,'Falta','Faltam')} ${v.falta} ${pl(v.falta,'venda','vendas')} hoje`}</div>
  <div class="contrib"><div class="c-r">Refuturiza no mês<b>${v.refu_mes}</b>sua parte do saldo: ${S.refu.cota}</div><div class="c-t">TIM Controle<b>${S.tim.cota}</b>sua parte do saldo</div></div>
  </button>`;
}
function render(){

let ocupado=false;
async function registrar(tipo){
  if(ocupado) return;
  const nome=abertoV; if(!pode(nome)) return;
  const antes=derive(), vA=antes.V.find(v=>v.nome===nome);
  ocupado=true; document.querySelectorAll('.act').forEach(b=>b.disabled=true);
  try{
    if(API_URL){ aplicar(await api({acao:'lancar',tipo,alvo:nome,v:SES.v,pin:SES.pin})); guardarHistorico() }
    else { LANC.push({id:'d'+Date.now(),ms:Date.now(),v:nome,tipo,por:ehG()?'gestão':nome,st:ehG()?'validado':'pendente'}); LS.set('cdt_demo',JSON.stringify(LANC)); render() }
    const depois=derive(), vD=depois.V.find(v=>v.nome===nome);
    if(tipo==='cdt'&&vA.meta_hoje&&vA.falta>0&&vD.falta===0){boom();toast(`${nome} bateu a meta do dia!`,true)}
    else if(tipo==='cdt'&&antes.falta>0&&depois.falta===0){boom();toast('Meta da unidade batida! Parabéns, time!',true)}
    else toast(`+1 ${TIPO[tipo].n} para ${nome}`);
  }catch(e){ render(); const m=$('#mmsg'); if(m) m.textContent='Não registrado: '+(e.message||'sem conexão'); }
  ocupado=false; document.querySelectorAll('.act').forEach(b=>b.disabled=false);
}

function gConf(){
  const hoje=S.hoje, L=LANC.filter(l=>isoOf(l.ms)===hoje).sort((a,b)=>b.ms-a.ms);
  const dup=new Set(); const by={};
  [...L].sort((a,b)=>a.ms-b.ms).forEach(l=>{const k=l.v+'|'+l.tipo;if(by[k]&&l.ms-by[k]<180000)dup.add(l.id);by[k]=l.ms});
  const pend=L.filter(l=>l.st!=='validado');
  return `<p class="note" style="margin:0 0 10px">${L.length} ${pl(L.length,'registro','registros')} hoje · <b>${pend.length} a conferir</b> · ${dup.size} com alerta de duplicidade (mesmo vendedor e produto em menos de 3 minutos).</p>
  ${pend.filter(l=>!dup.has(l.id)).length?`<button class="b1" id="g_valall" style="margin-bottom:10px">Validar todos sem alerta (${pend.filter(l=>!dup.has(l.id)).length})</button>`:''}

  ${L.map(l=>`<tr><td>${new Date(l.ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(l.v)}</b>${l.por==='gestão'?' <span class="sub">pela gestão</span>':''}</td><td>${TIPO[l.tipo]?TIPO[l.tipo].n:esc(l.tipo)}</td>
  <td><span class="st ${l.st==='validado'?'validado':'pendente'}">${l.st==='validado'?'validado':'a conferir'}</span>${dup.has(l.id)?' <span class="st dup">possível duplicidade</span>':''}${l.ms<=cut(l.tipo)?' <span class="sub">na base</span>':''}</td>
  <td class="n">${l.st!=='validado'?`<button class="mini-b" data-val="${esc(l.id)}">Validar</button> `:''}<button class="mini-b no" data-rec="${esc(l.id)}">Recusar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Nenhum registro hoje.</p>'}

function salvarGestao(){
  const nb=JSON.parse(JSON.stringify(BASE)), hoje=new Date();
  nb.data=hoje.toLocaleDateString('pt-BR'); nb.ms=nb.ms_cdt=nb.ms_tim=nb.ms_refu=gSnap; nb.meta_unid_dia=num('g_meta');
  const du=String($('#g_du').value).split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=31); if(du.length){nb.du_list=[...new Set(du)].sort((a,b)=>a-b); nb.du_mes=S.hoje.slice(0,7)}
  nb.vendedores=nb.vendedores.map((v,i)=>{const e=S.V[i],h=num('g_v'+i);return {...v,hoje:h,q2:num('g_a'+i),mq2:num('g_q'+i),refu_mes:num('g_r'+i),ferias:$('#g_f'+i).checked,vendas:h===e.hoje?e.vendas:[]}});
  nb.canais=Object.fromEntries(Object.keys(S.canaisObj).map((k,i)=>[k,num('g_c'+i)]));
  nb.tim={...nb.tim,real:num('g_tim'),meta:num('g_timm')}; nb.refu={...nb.refu,real:num('g_refu'),meta:num('g_refum')};
  salvarBase(nb,'g_msg','Salvo! Todos já veem os novos números.');
}
/* importação */
const norm=s=>String(s??'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const ALIAS={'MATHIAS AMARAL':'Mathias'}; const CANAIS=['CSC CAMPO GRANDE','WEB SITE - CARTAO DE TODOS','LIA - GT7'];
const quem=n=>{const k=norm(n);if(ALIAS[k])return ALIAS[k];const v=BASE.vendedores.find(v=>norm(v.completo)===k);return v?v.nome:null};
const brt=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+3,d.getMinutes(),d.getSeconds());
/* leitor de .xlsx embutido (sem biblioteca externa) */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), files={}; let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--; if(e<0)throw new Error('arquivo .xlsx inválido');
  let p=dv.getUint32(e+16,true); const n=dv.getUint16(e+10,true), td=new TextDecoder();
  for(let i=0;i<n;i++){
    const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+fl)); p+=46+fl+xl+cl;
    files[name]=async()=>{const lo=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=u8.slice(lo,lo+cs);
      if(met===0)return td.decode(raw);
      return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};
  }
  return files;
}
async function lerXLSX(buf){
  const f=await unzip(buf), X=t=>new DOMParser().parseFromString(t.replace(/^\uFEFF/,''),'application/xml'), T=(n,tag)=>[...n.getElementsByTagNameNS('*',tag)];
  const ss=f['xl/sharedStrings.xml']?T(X(await f['xl/sharedStrings.xml']()),'si').map(si=>T(si,'t').map(t=>t.textContent).join('')):[];
  const nome=Object.keys(f).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0]; if(!nome)throw new Error('planilha vazia');
  const ci=r=>{let n=0;for(const ch of r.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
  const linhas=T(X(await f[nome]()),'row').map(row=>{const a=[];let k=0;for(const c of T(row,'c')){const t=c.getAttribute('t'),v=T(c,'v')[0];let val=v?v.textContent:null;
    if(t==='s')val=ss[+val];else if(t==='inlineStr')val=T(c,'t').map(x=>x.textContent).join('');else if(t==='b')val=val==='1';else if(t!=='str'&&t!=='e'&&val!==null&&val!=='')val=+val;const r=c.getAttribute('r');if(r)k=ci(r);a[k++]=val}return a});
  const cab=(linhas.shift()||[]).map(h=>h==null?'':String(h));
  return linhas.filter(r=>r.some(v=>v!=null&&v!=='')).map(r=>Object.fromEntries(cab.map((h,i)=>[h,r[i]??null])));
}
const serial=v=>{if(v instanceof Date)return v;if(typeof v!=='number'||!isFinite(v))return null;const u=new Date(Math.round((v-25569)*864e5));return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),u.getUTCHours(),u.getUTCMinutes(),u.getUTCSeconds())};
async function importar(file){
  const m=$('#i_msg'); m.style.color='var(--ink)'; m.textContent='Lendo…'; IMP=null;
  try{
    const rows=await lerXLSX(await file.arrayBuffer());
    const col0=(r,h)=>{const k=Object.keys(r).find(k=>norm(k)===h);return k?r[k]:null};
    const col=(r,h)=>{const v=col0(r,h);return /^DATA/.test(h)?serial(v):v};
    if(rows.length&&Object.keys(rows[0]).some(k=>norm(k)==='PROSPECCAO')){
      const [y,mo]=S.hoje.split('-').map(Number), qz=iso=>iso.slice(0,7)+(+iso.slice(8)>=16?'b':'a');
      const ok=rows.filter(r=>{const d=col(r,'DATA');return d instanceof Date&&d.getFullYear()===y&&d.getMonth()+1===mo});
      if(!ok.length) throw new Error('o relatório não tem vendas do mês atual');
      if(ok.some(r=>isoOf(col(r,'DATA').getTime())>S.hoje)) throw new Error('o relatório tem datas depois de hoje');
      let ate=0, multi=false; const por={}, q2por={}, mesPor={}, canais={}, vendas={}, fora={};
      for(const r of ok){const dt=col(r,'DATA'), iso=isoOf(dt.getTime()); ate=Math.max(ate,brt(dt)); const n=quem(col(r,'VENDEDOR')), hoje=iso===S.hoje;
        if(!hoje) multi=true;
        if(n){ mesPor[n]=(mesPor[n]||0)+1; if(hoje){por[n]=(por[n]||0)+1;(vendas[n]=vendas[n]||[]).push({h:`${pad(dt.getHours())}:${pad(dt.getMinutes())}`,tipo:/REFILI/.test(norm(col(r,'PROSPECCAO')))?'Refiliação':'Filiação',pg:String(col(r,'NOME')||'')})} else if(qz(iso)===qz(S.hoje)) q2por[n]=(q2por[n]||0)+1 }
        else if(hoje){const c=String(col(r,'VENDEDOR')||'Outros').trim();canais[c]=(canais[c]||0)+1;if(!CANAIS.includes(norm(c)))fora[c]=1}}
      const linhas=S.V.filter(v=>!v.ferias||por[v.nome]||q2por[v.nome]).map(v=>({n:v.nome,rel:por[v.nome]||0,pai:v.hoje,qr:multi?(q2por[v.nome]||0):v.q2,qp:v.q2}));
      const at=new Date(ate-3*3600e3), dias=[...new Set(ok.map(r=>isoOf(col(r,'DATA').getTime())))].sort();
      IMP={tipo:'cdt',multi,rot:`${dias.length>1?dias[0].split('-').reverse().join('/')+' a ':''}${pad(at.getUTCDate())}/${pad(at.getUTCMonth()+1)} até ${pad(at.getUTCHours())}:${pad(at.getUTCMinutes())} (Brasília)`,linhas,ate,por,q2por,mesPor,canais,vendas,
        totRel:Object.values(por).reduce((a,b)=>a+b,0)+Object.values(canais).reduce((a,b)=>a+b,0),totPai:S.total,
        extra:`Hoje nos canais: ${Object.entries(canais).map(([k,n])=>k+' '+n).join(' · ')||'nenhum'}.${Object.keys(fora).length?' Nomes fora da lista de vendedores (contados como canal): '+Object.keys(fora).join(', ')+'.':''}${multi?' Relatório com vários dias: a quinzena acumulada será substituída pela do relatório.':' Relatório só de hoje: a quinzena acumulada é mantida.'}`};
    } else if(rows.length&&Object.keys(rows[0]).some(k=>norm(k)==='NOME VENDEDOR')){
      const [y,mo]=S.hoje.split('-').map(Number); const por={}; let total=0,last=0;
      for(const r of rows){const dt=col(r,'DATA CRIACAO ASSINATURA');if(!(dt instanceof Date)||dt.getFullYear()!==y||dt.getMonth()+1!==mo)continue;
        if(norm(col(r,'STATUS'))==='CANCELED')continue;total++;last=Math.max(last,dt.getDate());const n=quem(col(r,'NOME VENDEDOR'))||'Outros';por[n]=(por[n]||0)+1}
      const linhas=[...S.V.map(v=>({n:v.nome,rel:por[v.nome]||0,pai:v.refu_mes})),...(por.Outros?[{n:'Fora da escala',rel:por.Outros,pai:S.refu.real-S.V.reduce((a,v)=>a+v.refu_mes,0)}]:[])];
      IMP={tipo:'refu',rot:`${pad(last)}/${pad(mo)}`,linhas,por,total,ate:Date.UTC(y,mo-1,last+1,3)-1,totRel:total,totPai:S.refu.real};
    } else throw new Error('não reconheci as colunas deste arquivo');
    gRender(); const mm=$('#i_msg'); mm.style.color='var(--teal9)'; mm.textContent='Arquivo lido. Confira a comparação e aplique.';
  }catch(e){ const mm=$('#i_msg'); mm.style.color='var(--red)'; mm.textContent='Não foi possível ler: '+(e.message||'erro') }
}
function aplicarImp(){
  if(!IMP) return; const nb=JSON.parse(JSON.stringify(BASE)), I=IMP;
  if(I.tipo==='cdt'){
    nb.data=new Date().toLocaleDateString('pt-BR'); nb.ms_cdt=I.ate; nb.ms_tim=cut('tim'); nb.ms_refu=cut('refu');
    nb.vendedores=nb.vendedores.map((v,i)=>({...v,hoje:I.por[v.nome]||0,q2:I.multi?(I.q2por[v.nome]||0):S.V[i].q2,mes_cdt:I.multi?(I.mesPor[v.nome]||0):v.mes_cdt,refu_mes:S.V[i].refu_mes,vendas:I.vendas[v.nome]||[]}));
    nb.canais=I.canais; nb.refu.real=S.refu.real; nb.tim.real=S.tim.real; nb.refu.meta=S.refu.meta; nb.tim.meta=S.tim.meta;
  } else {
    nb.ms_refu=I.ate; nb.ms_cdt=cut('cdt'); nb.ms_tim=cut('tim');
    nb.data=new Date().toLocaleDateString('pt-BR'); nb.vendedores=nb.vendedores.map((v,i)=>({...v,hoje:S.V[i].hoje,q2:S.V[i].q2,vendas:S.V[i].vendas})); nb.canais={...S.canaisObj}; nb.tim.real=S.tim.real; nb.ms_cdt=nb.ms_tim=Date.now();
    nb.refu.real=I.total; nb.vendedores=nb.vendedores.map(v=>({...v,refu_mes:I.por[v.nome]||0}));
  }

}
async function conferir(acao,id){
  try{ if(API_URL){ aplicar(await api({acao,id,pin:SES.pin})); if(acao==='recusar')guardarHistorico() } else { if(acao==='recusar')LANC=LANC.filter(l=>l.id!==id); else LANC=LANC.map(l=>l.id===id?{...l,st:'validado'}:l); LS.set('cdt_demo',JSON.stringify(LANC)); render() } gRender() }
  catch(e){ toast('Não foi possível: '+e.message) }
}
async function validarTodos(){
  const hoje=S.hoje, L=LANC.filter(l=>isoOf(l.ms)===hoje&&l.st!=='validado').sort((a,b)=>a.ms-b.ms); const by={}, ok=[];
  [...LANC.filter(l=>isoOf(l.ms)===hoje)].sort((a,b)=>a.ms-b.ms).forEach(l=>{const k=l.v+'|'+l.tipo;if(!(by[k]&&l.ms-by[k]<180000)&&l.st!=='validado')ok.push(l.id);by[k]=l.ms});
  for(const id of ok) await conferir('validar',id);
  toast(`${ok.length} ${pl(ok.length,'registro validado','registros validados')}`);
}
